name: Quality and security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "15 7 * * 0"

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Lint shell scripts
        run: shellcheck -x -s bash --severity=warning ollama_intel_vulkan/run.sh
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ollama_intel_vulkan/Dockerfile
          failure-threshold: error

  build-and-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION=ci \
            --build-arg BUILD_NAME="Ollama for Intel Vulkan" \
            --build-arg BUILD_DESCRIPTION="Local Ollama server with Intel GPU acceleration through Vulkan" \
            --build-arg BUILD_REPOSITORY="${{ github.repository }}" \
            --build-arg BUILD_REF="${{ github.sha }}" \
            --tag app-under-test:ci \
            ollama_intel_vulkan
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app-under-test:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: 0
      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
